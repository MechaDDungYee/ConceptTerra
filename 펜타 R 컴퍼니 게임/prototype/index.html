function isSolid(index) {

function collide(x,y,r) {
  for (const ox of [-r,r]) for(const oy of [-r,r]) if(isSolid(cell(x+ox,y+oy))) return true;

  if(!collide(entity.x+dx,entity.y,r)) entity.x+=dx;
  if(!collide(entity.x,entity.y+dy,r)) entity.y+=dy;

function line(a,b,allowTarget=false) {
  const samples = Math.ceil(dist(a,b)/5);
  const target=allowTarget?cell(b.x,b.y):-2;
  for(let j=1;j<samples;j++) {
    const i=cell(a.x+(b.x-a.x)*j/samples,a.y+(b.y-a.y)*j/samples);

    ctx.fillText(state.mode==='brief'?'다목적팀 착륙 대기':state.mode==='paused'?'Esc 또는 일시정지 버튼으로 재개':'현장 근무 종료',W/2,H/2+7);
  }
}
function refresh() {
  const mins=Math.min(1320,420+Math.floor(elapsed*900/SHIFT));
  $('clock').textContent=format(Math.floor(mins/60))+':'+format(mins%60);
  $('shiftLabel').textContent='DAY '+format(state.day);
  $('stamina').textContent=Math.round(player.stamina);
  $('staminaBar').style.width=(player.stamina/player.max*100)+'%';
  $('quota').textContent=state.total+'/'+QUOTA;
  $('zone').textContent=zones[site.floor[cell(player.x,player.y)]]||zones[0];
  $('stateLabel').textContent={brief:'대기',active:'현장 연결',paused:'일시정지',report:'정산'}[state.mode];
  $('hold').textContent=heavy()?'양손':player.carry.length+'/2';
  $('cargo').textContent=player.carry.length?player.carry.map(o=>o.name+' · '+o.weight+'kg').join(' / '):'빈 배낭';
  if(state.mode!=='active') {
    $('hint').textContent={brief:'수거원을 선택하고 출격하세요.',paused:'일시정지 중',report:'정산 내용을 확인하세요.'}[state.mode];return;
  }
  const d=nearDoor(), item=nearCargo();
  if(docking()) $('hint').textContent=player.carry.length?'E 적재   ·   R 이륙':'적재선 · 화물을 들고 돌아오면 E   ·   R 이륙';
  else if(item&&(!d||dist(player,item)+3<dist(player,d))) $('hint').textContent='E '+item.name+' 회수   ·   Q '+(item.known?'예상 '+item.lo+(item.lo===item.hi?'':'~'+item.hi):'화물 감정');
  else if(d) $('hint').textContent='E '+(d.security?'보안문':'철문')+(d.open?' 닫기':' 열기')+(d.security?'   ·   Q 단말기 등록':'');
  else $('hint').textContent='출구는 남쪽 적재선   ·   현장 적재 '+site.loaded.length+'개'+(player.cooldown>0?'   ·   능력 대기 '+Math.ceil(player.cooldown)+'초':'');
}
function pause() {
  if(state.mode!=='active'&&state.mode!=='paused') return;
  state.mode=state.mode==='active'?'paused':'active';
  keys.clear();$('pause').textContent=state.mode==='active'?'일시정지':'재개';refresh();
}
function act(k) {
  if(k==='escape') {pause();return;}
  if(state.mode!=='active') return;
  if(k==='e') interact();
  if(k==='q') assess();
  if(k==='g') drop();
  if(k==='f') ability();
  if(k==='r') {
    if(docking()) finish('조기 귀환');else say('남쪽 비행선 적재선에 들어가야 이륙할 수 있습니다.');
  }
  refresh();
}
function briefing() {
  state.mode='brief';boot();
  $('report').hidden=true;$('brief').hidden=false;
  $('message').classList.remove('danger');$('message').textContent=standByMessage;
  [...$('crew').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===state.choice));
  $('ability').textContent=crew[state.choice][2]+' · '+crew[state.choice][3];
  refresh();
}
crew.forEach((entry,i)=>{
  const btn=document.createElement('button');btn.type='button';
  const img=document.createElement('img');img.alt='';img.className='portrait';
  const name=document.createElement('span');name.textContent=entry[1];btn.append(img,name);
  btn.addEventListener('click',()=>{state.choice=i;briefing();});
  $('crew').append(btn);
});
function loadPortraits(){
  const buffer=document.createElement('canvas');buffer.width=44;buffer.height=48;
  const g=buffer.getContext('2d');g.imageSmoothingEnabled=false;
  [...$('crew').children].forEach((b,i)=>{
    g.clearRect(0,0,44,48);g.drawImage(atlas,88,i*48,44,48,0,0,44,48);
    b.querySelector('img').src=buffer.toDataURL();
  });
}
atlas.addEventListener('load',loadPortraits,{once:true});
if(atlas.complete&&atlas.naturalWidth) loadPortraits();
$('launch').addEventListener('click',startShift);
$('next').addEventListener('click',()=>{
  if(state.day===3) {state.day=1;state.total=0;crypto.getRandomValues(state.seed);}else state.day++;
  briefing();
});
$('pause').addEventListener('click',pause);
$('sound').addEventListener('click',()=>{
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio) {say('이 브라우저에서는 효과음을 사용할 수 없습니다.');return;}
  state.sound=!state.sound;
  if(state.sound) {audio??=new Audio();audio.resume().then(()=>playTone(430)).catch(()=>{});}
  $('sound').setAttribute('aria-pressed',state.sound);$('sound').textContent=state.sound?'효과음 끄기':'효과음 켜기';
});
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(!dirKeys[k]&&!['shift','e','q','g','f','r','escape'].includes(k)) return;
  if(state.mode==='active'||state.mode==='paused') e.preventDefault();
  if(e.repeat) return;
  keys.add(k);if(!dirKeys[k]&&k!=='shift') act(k);
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{keys.clear();if(state.mode==='active') pause();});
document.querySelectorAll('.touch button').forEach(b=>{
  b.addEventListener('pointerdown',e=>{
    const k=b.dataset.key;b.setPointerCapture(e.pointerId);
    keys.add(k);if(!dirKeys[k]&&k!=='shift') act(k);
  });
  for(const ev of ['pointerup','pointercancel','lostpointercapture']) b.addEventListener(ev,()=>keys.delete(b.dataset.key));
});
briefing();
function loop(now) {
  const dt=timeLast?Math.min(.05,(now-timeLast)/1000):0;
  timeLast=now;
  if(state.mode==='active') update(dt);
  draw(now);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);


</script>
</body>
</html>
